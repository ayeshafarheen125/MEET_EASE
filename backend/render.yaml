services:
  - type: web
    name: meetease-backend
    runtime: python
    plan: free
    buildCommand: ""
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false